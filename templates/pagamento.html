{% extends 'base.html' %}

{% block conteudo %}
<div class="container mt-4">
    <h1 class="fw-bold">Registrar Pagamento da OS #{{ os_id }}</h1>
    
    <div class="card p-4 shadow-sm border-0 bg-white mt-3" style="max-width: 500px; border-radius: 15px;">
        <form method="POST">
            <label class="form-label fw-bold">Forma de pagamento:</label>
            <select name="forma_pagamento" class="form-select mb-3" required>
                <option value="PIX">PIX</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
            </select>

            <label class="form-label fw-bold">Valor pago (R$):</label>
            <input type="number" step="0.01" name="valor_pago" class="form-control mb-3" placeholder="0.00" required>

            <button type="submit" class="btn btn-success w-100 fw-bold">Confirmar e Finalizar OS</button>
            <a href="{{ url_for('gerenciar_os') }}" class="btn btn-link w-100 mt-2 text-muted">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
