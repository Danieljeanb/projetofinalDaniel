{% extends 'base.html' %}

{% block conteudo %}
<style>
    /* Reset local para evitar conflitos com a base */
    .auth-body-wrapper {
        background: #f6f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
        font-family: 'Montserrat', sans-serif;
    }

    .auth-container {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
        position: relative;
        overflow: hidden;
        width: 768px;
        max-width: 100%;
        min-height: 480px;
    }

    .form-container {
        position: absolute;
        top: 0;
        height: 100%;
        transition: all 0.6s ease-in-out;
    }

    .sign-in-container { left: 0; width: 50%; z-index: 2; }
    .auth-container.right-panel-active .sign-in-container { transform: translateX(100%); }

    .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
    .auth-container.right-panel-active .sign-up-container {
        transform: translateX(100%);
        opacity: 1;
        z-index: 5;
        animation: show 0.6s;
    }

    @keyframes show {
        0%, 49.99% { opacity: 0; z-index: 1; }
        50%, 100% { opacity: 1; z-index: 5; }
    }

    .auth-form {
        background-color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 50px;
        height: 100%;
        text-align: center;
    }

    .auth-input {
        background-color: #eee;
        border: none;
        padding: 12px 15px;
        margin: 8px 0;
        width: 100%;
    }

    .auth-button {
        border-radius: 20px;
        border: 1px solid #4facfe;
        background-color: #4facfe;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: bold;
        padding: 12px 45px;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: transform 80ms ease-in;
        cursor: pointer;
        margin-top: 10px;
    }

    .auth-button.ghost { background-color: transparent; border-color: #FFFFFF; }

    .overlay-container {
        position: absolute;
        top: 0;
        left: 50%;
        width: 50%;
        height: 100%;
        overflow: hidden;
        transition: transform 0.6s ease-in-out;
        z-index: 100;
    }

    .auth-container.right-panel-active .overlay-container { transform: translateX(-100%); }

    .overlay {
        background: linear-gradient(to right, #00f2fe, #4facfe);
        color: #FFFFFF;
        position: relative;
        left: -100%;
        height: 100%;
        width: 200%;
        transform: translateX(0);
        transition: transform 0.2s ease-in-out;
    }

    .auth-container.right-panel-active .overlay { transform: translateX(50%); }

    .overlay-panel {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 40px;
        text-align: center;
        top: 0;
        height: 100%;
        width: 50%;
        transition: transform 0.6s ease-in-out;
    }

    .overlay-left { transform: translateX(-20%); }
    .auth-container.right-panel-active .overlay-left { transform: translateX(0); }

    .overlay-right { right: 0; transform: translateX(0); }
    .auth-container.right-panel-active .overlay-right { transform: translateX(20%); }
</style>

<div class="auth-body-wrapper">
    <div class="auth-container" id="auth-main-container">
        <!-- Cadastro -->
        <div class="form-container sign-up-container">
            <form action="{{ url_for('cadastro') }}" method="POST" class="auth-form">
                <h1>Criar Conta</h1>
                <input type="text" name="nome" placeholder="Nome" class="auth-input" required />
                <input type="email" name="email" placeholder="Email" class="auth-input" required />
                <input type="password" name="senha" placeholder="Senha" class="auth-input" required />
                <button type="submit" class="auth-button">Cadastrar</button>
            </form>
        </div>

        <!-- Login -->
        <div class="form-container sign-in-container">
            <form action="{{ url_for('login') }}" method="POST" class="auth-form">
                <h1>Entrar</h1>
                <input type="email" name="email" placeholder="Email" class="auth-input" required />
                <input type="password" name="senha" placeholder="Senha" class="auth-input" required />
                <a href="#" style="font-size: 14px; margin: 10px;">Esqueceu a senha?</a>
                <button type="submit" class="auth-button">Login</button>
            </form>
        </div>

        <!-- Overlay -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Bem-vindo!</h1>
                    <p>Já tem conta? Faça login aqui</p>
                    <button class="auth-button ghost" id="signIn">Login</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Olá, Amigo!</h1>
                    <p>Ainda não tem conta? Registre-se agora</p>
                    <button class="auth-button ghost" id="signUp">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('auth-main-container');

    signUpButton.addEventListener('click', () => {
        container.classList.add("right-panel-active");
    });

    signInButton.addEventListener('click', () => {
        container.classList.remove("right-panel-active");
    });
</script>
{% endblock %}
