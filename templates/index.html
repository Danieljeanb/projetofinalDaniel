

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Oficina - Acesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }

        .container {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(255,255,255,0.1), 0 10px 10px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 580px;
        }

        .form-container {
            position: absolute; top: 0; height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }

        .container.right-panel-active .sign-in-container { transform: translateX(100%); }
        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1; z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        form {
            background-color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 0 40px; height: 100%; text-align: center;
        }

        input {
            background-color: #f1f1f1; border: none; padding: 10px 15px;
            margin: 5px 0; width: 100%; border-radius: 8px; font-size: 13px;
        }

        button {
            border-radius: 20px; border: 1px solid #000;
            background-color: #000; color: #FFFFFF;
            font-size: 12px; font-weight: bold;
            padding: 12px 45px; letter-spacing: 1px;
            text-transform: uppercase; transition: transform 80ms ease-in;
            cursor: pointer; margin-top: 15px;
        }

        button:active { transform: scale(0.95); }
        button.ghost { background-color: transparent; border-color: #FFFFFF; }

        .overlay-container {
            position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
            overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100;
        }

        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, #333, #000);
            color: #FFFFFF; position: relative; left: -100%;
            height: 100%; width: 200%;
            transform: translateX(0); transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 0 40px; text-align: center;
            top: 0; height: 100%; width: 50%;
            transform: translateX(0); transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        h1 { font-weight: bold; margin: 0 0 10px 0; font-size: 22px; }
        p { font-size: 14px; line-height: 20px; margin: 15px 0 20px; }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="form-container sign-up-container">
        <form action="/cadastrar" method="POST">
            <h1>Criar Conta</h1>
            <input type="text" name="nome" placeholder="Nome Completo" required />
            <input type="text" name="tel" placeholder="Telefone" required />
            <input type="email" name="email" placeholder="E-mail" required />
            <input type="text" name="doc" placeholder="Documento (CPF/CNPJ)" required />
            <input type="text" name="end" placeholder="Endereço Completo" required />
            <input type="password" name="senha" placeholder="Crie uma Senha" required />
            <button type="submit">Finalizar Cadastro</button>
        </form>
    </div>

    <div class="form-container sign-in-container">
        <form action="/login" method="POST">
            <h1>Entrar</h1>
            <input type="email" name="email" placeholder="E-mail" required />
            <input type="password" name="senha" placeholder="Senha" required />
            <button type="submit">Acessar Painel</button>
        </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Já é de casa?</h1>
                <p>Para manter-se conectado, faça o login com suas informações pessoais.</p>
                <button class="ghost" id="signIn">Ir para Login</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Olá, Mecânico!</h1>
                <p>Insira seus dados e comece a organizar sua oficina hoje mesmo.</p>
                <button class="ghost" id="signUp">Criar Conta</button>
            </div>
        </div>
    </div>
</div>

<script>
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => {
        container.classList.add("right-panel-active");
    });

    signInButton.addEventListener('click', () => {
        container.classList.remove("right-panel-active");
    });
</script>

</body>
</html>
